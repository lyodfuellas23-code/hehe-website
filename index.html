<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Will You Go Out With Me? 💗</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


    <main class="question-screen">


        <!-- ==================================
             Main content
        ================================== -->

        <div class="content">


            <!-- Cat -->

            <div class="cat-frame">

                <div class="cat-screen">

                    <div class="cat">
                        🐱
                    </div>

                </div>

            </div>


            <!-- Question -->

            <h1>
                Will you go<br>
                out with me?
            </h1>


            <!-- Buttons -->

            <div class="buttons">


                <!-- YES -->

                <button id="yes-button">
                    YES!
                </button>


                <!-- NO -->

                <div class="no-container">

                    <button id="no-button">
                        No
                    </button>

                    <p id="dialogue">
                        Please say yes 🥺
                    </p>

                </div>


            </div>

        </div>


    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>


</body>

</html>
