<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ERROR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


    <!-- ========================================
         INTRO SCREEN
    ======================================== -->

    <main
        class="intro-screen"
        id="intro-screen"
    >

        <div class="intro-content">

            <h1>
                May sasabihin ako...
            </h1>

            <button id="continue-button">
                CONTINUE
            </button>

        </div>

    </main>


    <!-- ========================================
         CLOUD TRANSITION
    ======================================== -->

    <div
        class="cloud-transition"
        id="cloud-transition"
    >

        <div class="transition-cloud cloud-1"></div>
        <div class="transition-cloud cloud-2"></div>
        <div class="transition-cloud cloud-3"></div>
        <div class="transition-cloud cloud-4"></div>
        <div class="transition-cloud cloud-5"></div>
        <div class="transition-cloud cloud-6"></div>
        <div class="transition-cloud cloud-7"></div>
        <div class="transition-cloud cloud-8"></div>
        <div class="transition-cloud cloud-9"></div>
        <div class="transition-cloud cloud-10"></div>
        <div class="transition-cloud cloud-11"></div>
        <div class="transition-cloud cloud-12"></div>

    </div>


    <!-- ========================================
         QUESTION SCREEN
    ======================================== -->

    <main
        class="question-screen"
        id="question-screen"
    >

        <div class="content">


            <!-- ========================================
                 CAT
            ======================================== -->

            <div class="cat-frame">

                <div class="cat-screen">

                    <div
                        class="cat"
                        id="cat"
                    >
                        🐱
                    </div>

                </div>

            </div>


            <!-- ========================================
                 QUESTION
            ======================================== -->

            <h2>
                Gusto kita...<br>
                Pwede ba kitang ligawan?
            </h2>


            <!-- ========================================
                 BUTTONS
            ======================================== -->

            <div class="buttons">


                <!-- YES -->

                <div
                    class="yes-container"
                    id="yes-container"
                >

                    <button id="yes-button">
                        Yes
                    </button>

                </div>


                <!-- NO + DIALOGUE -->

                <div
                    class="no-container"
                    id="no-container"
                >

                    <button id="no-button">
                        No
                    </button>

                    <p id="dialogue"></p>

                </div>


            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
